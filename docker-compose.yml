version: '3.8'

services:
  db:
    image: postgres:15
    container_name: eventify_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: eventify
    ports:
      - '5432:5432'
    volumes:
      - eventify_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: eventify_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - eventify_redisdata:/data

volumes:
  eventify_pgdata:
  eventify_redisdata:
